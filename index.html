<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SS School Needs</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e74c3c;
            --success: #25D366;
            --text-muted: #7f8c8d;
            --header-gradient: linear-gradient(135deg, #ff6b6b, #4ecdc4, #45aaf2);
        }

        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f8f9fa; padding-bottom: 100px; color: #333; }
        header { background: var(--header-gradient); color: white; padding: 30px 15px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; }
        .brand-name { font-family: 'Comic Sans MS', 'cursive'; font-size: 2.2rem; font-weight: 900; text-transform: uppercase; margin: 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .tagline { font-size: 0.9rem; background: rgba(255, 255, 255, 0.2); padding: 4px 12px; border-radius: 20px; margin-top: 8px; display: inline-block; }

        .filter-wrapper { overflow-x: auto; white-space: nowrap; padding: 15px; background: #f8f9fa; }
        .filter-btn { display: inline-block; padding: 8px 20px; margin-right: 10px; background: white; border: 1px solid #ddd; border-radius: 25px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
        .filter-btn.active { background: var(--primary); color: white; }

        .container { padding: 0 15px 15px 15px; max-width: 600px; margin: auto; }
        .product-card { background: white; padding: 12px; margin-bottom: 12px; border-radius: 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid #eee; }
        .product-img { width: 75px; height: 75px; object-fit: contain; border-radius: 10px; }
        .info { flex-grow: 1; }
        .p-name { font-weight: 600; color: var(--primary); display: block; }
        .p-offer { color: #2ecc71; font-weight: 800; font-size: 1.05rem; }
        .p-mrp { color: var(--text-muted); text-decoration: line-through; font-size: 0.8rem; margin-left: 5px; }
        .add-btn { background: var(--primary); color: white; border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        .cart-fab { position: fixed; bottom: 25px; right: 25px; background: var(--primary); color: white; width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 999; }
        .cart-badge { position: absolute; top: 0; right: 0; background: var(--accent); padding: 4px 8px; border-radius: 50%; font-size: 0.8rem; }

        .cart-overlay { position: fixed; top: 0; right: -100%; width: 100%; height: 100%; background: #f8f9fa; z-index: 1001; transition: 0.3s; display: flex; flex-direction: column; }
        .cart-overlay.active { right: 0; }
        .cart-header { padding: 20px; background: var(--primary); color: white; display: flex; justify-content: space-between; align-items: center; }
        .cart-footer { padding: 20px; background: white; border-top: 1px solid #eee; }
        .wa-btn { background: var(--success); color: white; display: block; text-align: center; padding: 16px; border-radius: 12px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <span class="brand-name">SS School Needs</span><br>
    <span class="tagline">✨ Fun Tools for Smart Kids ✨</span>
</header>

<div class="filter-wrapper">
    <div class="filter-btn active" onclick="filterProducts('All', this)">All Items</div>
    <div class="filter-btn" onclick="filterProducts('New', this)">New Arrivals</div>
    <div class="filter-btn" onclick="filterProducts('Pen', this)">Pens</div>
    <div class="filter-btn" onclick="filterProducts('Notebook', this)">Notebooks</div>
</div>

<div class="container" id="shop-list">
    <p style="text-align:center; margin-top:50px;">Loading Products...</p>
</div>

<div class="cart-fab" onclick="toggleCart()">
    <span style="font-size: 1.8rem;">🛒</span>
    <div class="cart-badge" id="cart-count">0</div>
</div>

<div class="cart-overlay" id="cart-page">
    <div class="cart-header"><h2>My Cart</h2><button onclick="toggleCart()" style="background:none; border:none; color:white; font-size:1.8rem;">✕</button></div>
    <div style="flex-grow:1; overflow-y:auto; padding:15px;" id="cart-items-content"></div>
    <div class="cart-footer">
        <div style="display:flex; justify-content:space-between; margin-bottom:10px;"><span>Final Amount:</span><span style="font-weight:bold;">₹<span id="cart-total">0</span></span></div>
        <a href="#" class="wa-btn" onclick="sendOrder()">Order on WhatsApp</a>
    </div>
</div>

<script>
    // REPLACE THIS URL with your GitHub Raw Link
    const jsonURL = "https://raw.githubusercontent.com/sureshvdpi-rgb/praven/refs/heads/main/products.json";

    let products = [];
    let cart = {};

    // FETCH DATA FROM GITHUB
    async function loadProducts() {
        try {
            const response = await fetch(jsonURL);
            products = await response.json();
            renderShop();
        } catch (error) {
            document.getElementById('shop-list').innerHTML = "<p style='color:red; text-align:center;'>Error loading products. Please check your internet.</p>";
        }
    }

    function renderShop(filter = 'All') {
        const list = document.getElementById('shop-list');
        const filtered = filter === 'All' ? products : products.filter(p => p.category === filter);
        list.innerHTML = filtered.map(p => `
            <div class="product-card">
                <img src="${p.img}" class="product-img" onerror="this.src='https://via.placeholder.com/90'">
                <div class="info">
                    <span class="p-name">${p.name}</span>
                    <span class="p-offer">₹${p.price}</span>
                    <span class="p-mrp">₹${p.mrp}</span>
                </div>
                <button class="add-btn" onclick="updateQty(${p.id}, 1)">ADD +</button>
            </div>
        `).join('');
    }

    function filterProducts(cat, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderShop(cat);
    }

    function toggleCart() { document.getElementById('cart-page').classList.toggle('active'); renderCart(); }

    function updateQty(id, change) {
        cart[id] = (cart[id] || 0) + change;
        if (cart[id] <= 0) delete cart[id];
        updateSummary();
        renderCart();
    }

    function updateSummary() {
        let totalItems = Object.values(cart).reduce((a, b) => a + b, 0);
        document.getElementById('cart-count').innerText = totalItems;
        let total = 0;
        for (let id in cart) {
            const p = products.find(prod => prod.id == id);
            total += (p.price * cart[id]);
        }
        document.getElementById('cart-total').innerText = total;
    }

    function renderCart() {
        const content = document.getElementById('cart-items-content');
        const cartIds = Object.keys(cart);
        if(cartIds.length === 0) { content.innerHTML = "<p style='text-align:center; padding:50px;'>Empty Cart</p>"; return; }
        content.innerHTML = cartIds.map(id => {
            const p = products.find(prod => prod.id == id);
            return `
                <div class="product-card">
                    <div class="info"><span class="p-name">${p.name}</span><span>₹${p.price * cart[id]}</span></div>
                    <button onclick="updateQty(${p.id}, -1)">-</button> ${cart[id]} <button onclick="updateQty(${p.id}, 1)">+</button>
                </div>`;
        }).join('');
    }

    function sendOrder() {
        let msg = "*NEW ORDER*%0a";
        let total = 0;
        for (let id in cart) {
            const p = products.find(prod => prod.id == id);
            msg += `• ${p.name} x ${cart[id]} = ₹${p.price * cart[id]}%0a`;
            total += (p.price * cart[id]);
        }
        msg += `*Total: ₹${total}*`;
        window.open(`https://wa.me/919000000000?text=${msg}`);
    }

    loadProducts(); // Initialize on page load
</script>
</body>
</html>
