<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SS School Needs</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e74c3c;
            --success: #25D366;
            --text-muted: #7f8c8d;
            --header-gradient: linear-gradient(135deg, #ff6b6b, #4ecdc4, #45aaf2);
        }

        body { font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; background: #f8f9fa; padding-bottom: 100px; color: #333; }
        
        header { 
            background: var(--header-gradient); 
            color: white; padding: 30px 15px; text-align: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; 
        }
        .brand-name { font-family: 'Comic Sans MS', 'cursive'; font-size: 2.2rem; font-weight: 900; text-transform: uppercase; margin: 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); display: block; }
        .tagline { font-size: 0.9rem; background: rgba(255, 255, 255, 0.2); padding: 4px 12px; border-radius: 20px; margin-top: 8px; display: inline-block; backdrop-filter: blur(5px); }

        /* Search and Dropdown Section */
        .controls-wrapper {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 600px;
            margin: auto;
        }
        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }
        #product-search {
            width: 100%;
            padding: 12px 40px 12px 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .clear-search {
            position: absolute;
            right: 15px;
            background: #ddd;
            color: #666;
            border: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 0.7rem;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
        }
        #category-dropdown {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 15px;
            background: white;
            font-size: 1rem;
            font-weight: 600;
            color: var(--primary);
            outline: none;
            cursor: pointer;
        }

        .container { padding: 0 15px 15px 15px; max-width: 600px; margin: auto; }
        
        .main-savings-banner { background: #fff; margin: 0 15px 15px 15px; padding: 12px; border-radius: 12px; text-align: center; border: 1px dashed var(--accent); display: none; }

        .product-card { background: white; padding: 12px; margin-bottom: 12px; border-radius: 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid #eee; }
        .product-img { width: 75px; height: 75px; object-fit: contain; border-radius: 10px; border: 1px solid #f0f0f0; }
        .info { flex-grow: 1; }
        .p-name { font-weight: 600; font-size: 1rem; color: var(--primary); display: block; }
        .price-container { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
        .p-offer { color: #2ecc71; font-weight: 800; font-size: 1.05rem; }
        .p-mrp { color: var(--text-muted); text-decoration: line-through; font-size: 0.8rem; }
        .p-save-tag { background: #fff3f2; color: var(--accent); font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; border: 1px solid #ffdcd9; }

        .add-btn { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        .cart-fab { position: fixed; bottom: 25px; right: 25px; background: var(--primary); color: white; width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 999; cursor: pointer; }
        .cart-badge { position: absolute; top: 0; right: 0; background: var(--accent); color: white; font-size: 0.8rem; padding: 4px 8px; border-radius: 50%; font-weight: bold; }

        .cart-overlay { position: fixed; top: 0; right: -100%; width: 100%; height: 100%; background: #f8f9fa; z-index: 1001; transition: 0.3s; display: flex; flex-direction: column; }
        .cart-overlay.active { right: 0; }
        .cart-header { padding: 20px; background: var(--primary); color: white; display: flex; justify-content: space-between; align-items: center; }
        .cart-items-list { flex-grow: 1; overflow-y: auto; padding: 15px; }
        
        .qty-controls { display: flex; align-items: center; background: #f1f3f4; border-radius: 8px; padding: 2px; }
        .qty-btn { width: 30px; height: 30px; border: none; background: white; border-radius: 5px; font-weight: bold; cursor: pointer; color: var(--primary); }
        .qty-val { margin: 0 10px; font-weight: bold; }

        .cart-footer { padding: 20px; border-top: 1px solid #eee; background: #fff; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.95rem; }
        .total-row { display: flex; justify-content: space-between; font-size: 1.3rem; margin-top: 10px; margin-bottom: 15px; font-weight: 800; border-top: 1px solid #eee; padding-top: 10px; }
        .wa-btn { background: var(--success); color: white; display: block; text-align: center; padding: 16px; border-radius: 12px; text-decoration: none; font-weight: bold; font-size: 1.1rem; }
    </style>
</head>
<body>

<header>
    <span class="brand-name">SS School Needs</span>
    <span class="tagline">✨ Fun Tools for Smart Kids ✨</span>
</header>

<div class="controls-wrapper">
    <div class="search-box">
        <input type="text" id="product-search" placeholder="Search for items (e.g. gel pen)..." oninput="handleFilter()">
        <button class="clear-search" id="clear-btn" onclick="clearSearch()">✕</button>
    </div>
    
    <select id="category-dropdown" onchange="handleFilter()">
        <option value="All">All Categories</option>
        <option value="New">New Arrivals</option>
        <option value="Pen">Pens & Refills</option>
        <option value="Notebook">Notebooks & Paper</option>
    </select>
</div>

<div class="main-savings-banner" id="main-save-banner">
    <span style="font-size: 0.9rem; color: var(--text-muted);">You are saving </span>
    <b style="color: var(--accent); font-size: 1.1rem;">₹<span id="main-save-amt">0</span></b>
    <span style="font-size: 0.9rem; color: var(--text-muted);"> today! 🎉</span>
</div>

<div class="container" id="shop-list">
    <p style="text-align:center; padding:50px;">Loading Catalog...</p>
</div>

<div class="cart-fab" onclick="toggleCart()">
    <span style="font-size: 1.8rem;">🛒</span>
    <div class="cart-badge" id="cart-count">0</div>
</div>

<div class="cart-overlay" id="cart-page">
    <div class="cart-header">
        <h2 style="margin:0">My Cart</h2>
        <button onclick="toggleCart()" style="background:none; border:none; color:white; font-size:1.8rem; cursor:pointer;">✕</button>
    </div>
    <div class="cart-items-list" id="cart-items-content"></div>
    <div class="cart-footer">
        <div class="summary-row" style="color: var(--text-muted);"><span>Total MRP:</span><span>₹<span id="cart-mrp">0</span></span></div>
        <div class="summary-row" style="color: var(--accent); font-weight: bold;"><span>Your Savings:</span><span>-₹<span id="cart-savings">0</span></span></div>
        <div class="total-row"><span>Payable:</span><span style="color:var(--primary)">₹<span id="cart-total">0</span></span></div>
        <a href="#" class="wa-btn" onclick="sendOrder()">Order on WhatsApp</a>
    </div>
</div>

<script>
    // GitHub Raw URL for your products.json
    const jsonURL = "https://raw.githubusercontent.com/sureshvdpi-rgb/praven/refs/heads/main/products.json";

    let products = [];
    let cart = {};

    async function loadProducts() {
        try {
            const response = await fetch(jsonURL);
            products = await response.json();
            handleFilter();
        } catch (e) {
            document.getElementById('shop-list').innerHTML = "<p style='text-align:center; color:red;'>Failed to load products.</p>";
        }
    }

    function handleFilter() {
        const searchTerm = document.getElementById('product-search').value.toLowerCase();
        const selectedCat = document.getElementById('category-dropdown').value;
        const clearBtn = document.getElementById('clear-btn');
        
        // Show/Hide clear button
        clearBtn.style.display = searchTerm.length > 0 ? 'flex' : 'none';

        const filtered = products.filter(p => {
            const matchesCategory = (selectedCat === 'All' || p.category === selectedCat);
            const matchesSearch = p.name.toLowerCase().includes(searchTerm) || 
                                 p.category.toLowerCase().includes(searchTerm);
            return matchesCategory && matchesSearch;
        });

        renderShop(filtered);
    }

    function clearSearch() {
        document.getElementById('product-search').value = '';
        handleFilter();
    }

    function renderShop(data) {
        const list = document.getElementById('shop-list');
        if (data.length === 0) {
            list.innerHTML = `<p style="text-align:center; padding:50px; color:#888;">No matching items found.</p>`;
            return;
        }

        list.innerHTML = data.map(p => {
            const save = p.mrp - p.price;
            return `
                <div class="product-card">
                    <img src="${p.img}" class="product-img" onerror="this.src='https://via.placeholder.com/90'">
                    <div class="info">
                        <span class="p-name">${p.name}</span>
                        <div class="price-container">
                            <span class="p-offer">₹${p.price}</span>
                            <span class="p-mrp">₹${p.mrp}</span>
                            ${save > 0 ? `<span class="p-save-tag">Save ₹${save}</span>` : ''}
                        </div>
                    </div>
                    <button class="add-btn" onclick="updateQty(${p.id}, 1)">ADD +</button>
                </div>`;
        }).join('');
    }

    function toggleCart() { document.getElementById('cart-page').classList.toggle('active'); renderCart(); }

    function updateQty(id, change) {
        cart[id] = (cart[id] || 0) + change;
        if (cart[id] <= 0) delete cart[id];
        updateSummary();
        renderCart();
    }

    function updateSummary() {
        let totalItems = 0, totalSavings = 0, totalPayable = 0, totalMRP = 0;
        for (let id in cart) {
            const p = products.find(prod => prod.id == id);
            if(p) {
                totalItems += cart[id];
                totalMRP += (p.mrp * cart[id]);
                totalPayable += (p.price * cart[id]);
            }
        }
        totalSavings = totalMRP - totalPayable;
        document.getElementById('cart-count').innerText = totalItems;
        const banner = document.getElementById('main-save-banner');
        banner.style.display = totalSavings > 0 ? 'block' : 'none';
        document.getElementById('main-save-amt').innerText = totalSavings;
        document.getElementById('cart-mrp').innerText = totalMRP;
        document.getElementById('cart-savings').innerText = totalSavings;
        document.getElementById('cart-total').innerText = totalPayable;
    }

    function renderCart() {
        const content = document.getElementById('cart-items-content');
        const cartIds = Object.keys(cart);
        if(cartIds.length === 0) { content.innerHTML = "<p style='text-align:center; padding:50px; color:#888;'>Cart is empty</p>"; return; }
        content.innerHTML = cartIds.map(id => {
            const p = products.find(prod => prod.id == id);
            const qty = cart[id];
            return `
                <div class="product-card">
                    <div class="info">
                        <span class="p-name">${p.name}</span>
                        <span class="p-offer">₹${p.price * qty}</span>
                        <div style="font-size:0.7rem; color:var(--accent);">Saved ₹${(p.mrp - p.price) * qty}</div>
                    </div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="updateQty(${p.id}, -1)">-</button>
                        <span class="qty-val">${qty}</span>
                        <button class="qty-btn" onclick="updateQty(${p.id}, 1)">+</button>
                    </div>
                </div>`;
        }).join('');
    }

    function sendOrder() {
        let msg = "*ORDER: SS SCHOOL NEEDS*%0a--------------------------%0a";
        let totalPayable = 0, totalMrp = 0;
        for (let id in cart) {
            const p = products.find(prod => prod.id == id);
            const sub = p.price * cart[id];
            totalPayable += sub;
            totalMrp += (p.mrp * cart[id]);
            msg += `• *${p.name}* x ${cart[id]} = ₹${sub}%0a`;
        }
        msg += `--------------------------%0a*Subtotal:* ₹${totalMrp}%0a*Savings:* -₹${totalMrp - totalPayable}%0a*FINAL TOTAL: ₹${totalPayable}*%0a--------------------------%0aPlease confirm!`;
        window.open(`https://wa.me/918438553395?text=${msg}`);
    }

    loadProducts();
</script>
</body>
</html>
